name: Idea
description: Suggest a feature or a change
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Start with what's hard today, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you have in mind?
    validations:
      required: true
  - type: checkboxes
    id: build
    attributes:
      label: Building it
      options:
        - label: I'd like to build this myself once it's agreed
