name: CI

on:
  pull_request:
  push:
    branches: [main]

# Runs untrusted code from forks. Keep it on `pull_request` (never `pull_request_target`),
# read-only, and free of real secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders so the build can run. Nothing here connects to anything.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ci-placeholder
      VAPID_PRIVATE_KEY: ci-placeholder
      VAPID_SUBJECT: mailto:ci@example.com
      CRON_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
